# SonarQube Cloud project settings.
# Organization and project keys come from the project page on https://sonarcloud.io
sonar.organization=dm-malon
sonar.projectKey=dm-malon_review-bench
sonar.projectName=review-bench

# What to analyze.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# No tests yet, so coverage is not measured. Files are still analyzed for bugs,
# vulnerabilities and code smells; only the coverage condition is skipped.
# Remove this line when tests are added.
sonar.coverage.exclusions=**/*

# Test coverage will be added together with the first code that has tests:
# sonar.tests=.
# sonar.test.inclusions=**/*.spec.ts
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
