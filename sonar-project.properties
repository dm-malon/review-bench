# SonarQube Cloud project settings.
# Organization and project keys come from the project page on https://sonarcloud.io
sonar.organization=dm-malon
sonar.projectKey=dm-malon_review-bench
sonar.projectName=review-bench

# Only the application in src/ is analyzed. The review tooling in tools/ is not part
# of the product, so it is outside the analysis (issues and coverage).
sonar.sources=src
sonar.exclusions=**/*.spec.ts

# Tests and coverage. CI runs `npm run test:ci` before the scan to produce lcov.
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.javascript.lcov.reportPaths=coverage/review-bench/lcov.info
# Bootstrap file with no logic of its own.
sonar.coverage.exclusions=src/main.ts
