# SonarQube Cloud project settings.
# Organization and project keys come from the project page on https://sonarcloud.io
sonar.organization=dm-malon
sonar.projectKey=dm-malon_review-bench
sonar.projectName=review-bench

# SonarQube Cloud analyzes the whole repository and ignores sonar.sources / sonar.tests,
# so everything that is not the application in src/ is excluded here: the review tooling,
# CI config, and root-level config files. Test files (*.spec.ts) are detected automatically.
sonar.exclusions=tools/**,.github/**,public/**,*.json

# Coverage from `npm run test:ci`, which CI runs before the scan.
sonar.javascript.lcov.reportPaths=coverage/review-bench/lcov.info
# Test files are not detected as tests automatically, so they are excluded from coverage
# explicitly; bootstrap and provider wiring have no logic of their own.
sonar.coverage.exclusions=**/*.spec.ts,src/main.ts,src/app/app.config.ts
